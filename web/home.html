<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chemistry IX in 3D · Asawera</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#07080b">
<style>
  :root { --gold: #ffb347; --blue: #4aa8ff; --edge: rgba(90, 150, 255, .35); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 35%, #142038 0%, #07080b 65%); color: #e8eefc;
    font-family: Inter, "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; padding: max(18px, env(safe-area-inset-top)) 18px 24px; overflow-y: auto; }
  header { width: 100%; display: flex; align-items: center; gap: 10px; }
  header .spacer { flex: 1; }
  .badge { font-size: 12px; opacity: .75; }
  h1 { color: var(--gold); font-size: clamp(28px, 4.4vw, 46px); margin: 18px 0 4px; text-shadow: 0 0 22px #ff9f2e66; letter-spacing: .5px; }
  .sub { opacity: .75; margin: 0 0 22px; }
  #atom { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .5; }
  #cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; width: min(1100px, 100%); }
  .card { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 20px 20px 18px; border-radius: 22px;
    background: linear-gradient(160deg, rgba(22, 32, 56, .86), rgba(9, 13, 24, .86)); border: 1px solid var(--edge);
    box-shadow: 0 10px 40px #0008; text-decoration: none; color: inherit; transition: transform .15s; }
  .card:active { transform: scale(.98); }
  .card .num { position: absolute; right: 18px; top: 10px; font-size: 64px; font-weight: 800; color: #ffffff10; }
  .card .icon { font-size: 40px; filter: drop-shadow(0 0 10px #4aa8ff88); }
  .card b { font-size: 22px; color: var(--gold); }
  .card .blurb { opacity: .85; font-size: 15px; min-height: 2.6em; }
  .card .meta { font-size: 13px; color: #9fc6ff; }
  .row { display: flex; gap: 10px; margin-top: 6px; }
  .row a { flex: 1; text-align: center; padding: 12px 10px; border-radius: 14px; text-decoration: none; font-weight: 700; color: #1a1200;
    background: var(--gold); box-shadow: 0 0 16px #ffb34755; }
  .row a.g { background: #1d2a44; color: #e8eefc; border: 1px solid var(--edge); box-shadow: none; }
  #cont { margin: 0 0 18px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--edge); background: rgba(10, 14, 22, .7);
    color: inherit; text-decoration: none; }
  #cont[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="atom"></canvas>
<header><span class="spacer"></span><span id="offlineBadge" class="badge" role="status"></span></header>
<h1>Chemistry IX in 3D</h1>
<p class="sub">Choose a chapter: watch the 3D films, then play the games.</p>
<a id="cont" hidden></a>
<div id="cards"></div>
<script type="module" src="offline.js"></script>
<script type="module">
// Chapters home page: one card per textbook unit (from films.json), plus "continue" for the last film watched.
const list = await fetch('films.json').then((r) => r.json());
const films = list.films, num = (u) => u.slice(1);
document.getElementById('cards').innerHTML = list.chapters.map((c) => {
  const n = films.filter((f) => f.unit === c.id).length, [unit, ...rest] = c.title.split(' · ');
  return `<div class="card"><span class="num">${num(c.id)}</span><span class="icon">${c.icon || '🔬'}</span>
    <b>${rest.join(' · ') || unit}</b><span class="meta">${unit} · pp. ${c.pages || ''} · ${n} films</span>
    <span class="blurb">${c.blurb || ''}</span>
    <div class="row"><a href="index.html?unit=${num(c.id)}">▶ Films</a><a class="g" href="games.html?unit=${num(c.id)}">🎮 Games</a></div></div>`;
}).join('');
let last = null;
try { last = films.find((f) => f.id === localStorage.getItem('film')); } catch { /* private mode */ }
if (last) { const a = document.getElementById('cont'); a.href = `index.html?film=${last.id}`; a.textContent = `▶ Continue: ${last.title}`; a.hidden = false; }
// a slow glowing atom drawn behind the cards (2D canvas: no 3D load on the home page)
const cv = document.getElementById('atom'), x = cv.getContext('2d');
const draw = (t) => {
  const w = cv.width = innerWidth * devicePixelRatio, h = cv.height = innerHeight * devicePixelRatio, cx = w / 2, cy = h * 0.55, R = Math.min(w, h) * 0.42;
  x.clearRect(0, 0, w, h);
  for (let k = 0; k < 3; k++) {
    x.save(); x.translate(cx, cy); x.rotate(k * Math.PI / 3 + t * 0.00004);
    x.strokeStyle = 'rgba(92,157,255,.35)'; x.lineWidth = 2 * devicePixelRatio; x.beginPath(); x.ellipse(0, 0, R, R * 0.36, 0, 0, Math.PI * 2); x.stroke();
    const a = t * 0.0006 * (1 + k * 0.3) + k * 2;
    const g = x.createRadialGradient(R * Math.cos(a), R * 0.36 * Math.sin(a), 0, R * Math.cos(a), R * 0.36 * Math.sin(a), 18 * devicePixelRatio);
    g.addColorStop(0, '#bfe0ff'); g.addColorStop(0.3, '#4aa8ff'); g.addColorStop(1, 'rgba(74,168,255,0)');
    x.fillStyle = g; x.beginPath(); x.arc(R * Math.cos(a), R * 0.36 * Math.sin(a), 18 * devicePixelRatio, 0, Math.PI * 2); x.fill(); x.restore();
  }
  const n = x.createRadialGradient(cx, cy, 0, cx, cy, 40 * devicePixelRatio);
  n.addColorStop(0, '#ff9a7a'); n.addColorStop(0.4, '#e8483f'); n.addColorStop(1, 'rgba(232,72,63,0)');
  x.fillStyle = n; x.beginPath(); x.arc(cx, cy, 40 * devicePixelRatio, 0, Math.PI * 2); x.fill();
  requestAnimationFrame(draw);
};
requestAnimationFrame(draw);
document.title = 'READY';
</script>
</body>
</html>
